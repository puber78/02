## 研究问题

在主预算 b=40 下，**数字规则**选出的模型，其在独立评价池（T_pilot，700 源）上的物理 AUC，
是否显著低于**同预算真实直接规则**选出的模型？

- 数字规则：在 C_b（C_pool 中抽 b 个源）上，按冻结的 S_dig = 5 个数字族（clean, F1_jpeg, F2_scale,
  F3_blur, F4_color）AUC 的等权平均，取 argmax。
- 真实直接规则：在同一 C_b 上，按物理 AUC 取 argmax。
- 评价：两者选中的模型在 T_pilot 全部 700 源上的物理 AUC 之差（regret = 真实直接 − 数字）。
- 方向：按 DEC-0011，选择口径使用"方向校正后 AUC"（校正方向在 C_pool 数字 clean 上确定，不读物理）。
  另做"声明方向"敏感性分析（resnet_ai / vit_ai_real 若声明方向 AUC<0.5 则保留原方向）。

## 待检验预测 P05（事前）

1. **主预测**：regret 的均值可能在 0 附近，区间跨 0。理由：EXAM04 显示数字最强的 swinv2 在实拍上
   仍是第一（0.8938 vs siglip 0.8507），排名大概率被保留；数字规则的失败模式更可能是"选错第二三名"，
   而不是"选错冠军"。
2. **允许的替代结果**（任一出现都不算异常）：
   - a) regret 显著 > 0（数字规则确实更差，δ=0.01 以上）；
   - b) regret 显著 < 0（数字规则反而更好，例如数字域噪声恰好避开物理域的系统偏差）；
   - c) 区间宽、证据不足（b=40 时选择本身不稳定）。
3. **预算效应**：b=20 的 regret 离散度应大于 b=80；若 b=80 仍不稳定，说明"预算不足"是主导问题，
   而非"数字信息无用"。

## 判读规则（事前写定）

- δ = 0.01（实质性阈值，与 `protocols/pilot_analysis.yaml` 一致）。
- 主结论语句只允许以下三种之一：
  - "数字规则相对同预算真实直接规则，物理 AUC 损失 > δ"（均值 regret > δ 且 95% CI 下界 > 0）；
  - "损失 < δ 或无法区分"（CI 覆盖 [0, δ]）；
  - "数字规则更优"（均值 regret < −δ 且 CI 上界 < 0）。
- 不得依据 b∈{20,40,80} 中"最显著"的一个改主结论；b=40 为主，20/80 为预定辅助。
- 绝对 regret（相对 oracle）与点排名只作辅助描述，不作主结论。
- 若选择在重放间高度不稳定（>30% 的重放选中不同模型），必须同时报告"选择稳定性"，
  不能只报单一均值。

## 推断方案（事前写定）

- 外层校准重放：每个预算 200 次，C_pool 内无放回抽样，种子 20261026 + 预算。
- 评价不确定性：T_pilot 源级 bootstrap 2000 次。
- 联合推断：每次迭代同时重抽 C_b（有放回）与 T_pilot（有放回），重跑选择，得到
  regret 的联合分布；主 CI 用联合分布，辅助 CI 用"固定选择 + 评价重抽"。
- 多重比较：EXAM05 只有一个主端点（regret 均值），不做事后子组挑选。

## 否证条件

- 若联合 95% CI 完全落在 [−δ, δ] 内，则"数字选型造成实质损失"这一动机**不成立**，
  论文必须改写动机（从"选错模型"改为"分数失真"）。
- 若 b=80 的 CI 仍宽于 ±0.05，则说明该设计在当前池规模下无法回答选型问题，
  必须记录为设计局限，不得用点估计下结论。

