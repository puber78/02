type: protocol_expectation
statement: >-
  A fixed capture protocol (one 2560x1440 display, one phone, fixed distance and
  framing) should make per-capture geometric and photometric quality stable across
  10 sessions, with isolated failures traceable to procedurally detectable causes
  (blur, glare, mis-press).  Detection AUC on rectified photos is expected to be
  lower than on the untouched digital originals, with the gap differing by model.

