# Candidate selection rules (execution outline §6). Implementation status is
# tracked per rule; a rule without a real implementation cannot enter a result.
version: selectors_v2_frozen_exam03
created_at: "2026-10-26T00:00:00Z"
frozen_at: "2026-11-02T06:45:00Z"
approval_status: FROZEN_FOR_EXAM03
freeze_stage: EXAM03
freeze_note: >-
  EXAM03 freezes the *primary* digital-only rule (S_dig, equal-weight family AUC on
  C_pool) plus three sensitivity rules.  Physical-reading rules (S_real, S_shrink,
  S_quality, S_weight, S_residual) belong to EXAM04 and are deliberately NOT used to
  pick the EXAM03 candidate; they are listed so the frozen set is complete.

exam03_digital_rules:
  S_dig:
    description: equal-weight mean of per-family AUC (F1-F4) computed on C_pool
    reads_physical: false
    primary: true
    budget: {captures: 0, inferences: "4 families x |C_pool|"}
  S_worst:
    description: maximin over families (highest worst-family AUC on C_pool)
    reads_physical: false
    primary: false
  S_clean:
    description: clean-only digital AUC on C_pool (the naive proxy)
    reads_physical: false
    primary: false
  S_rand:
    description: uniform random candidate, seeded 20261026 (negative control)
    reads_physical: false
    primary: false

freeze_constraints:
  - rules are evaluated on C_pool only; D_sel is a digital hold-out
  - T_pilot is never read by any EXAM03 rule
  - ties broken by frozen_model_id_priority

tie_rule:
  method: frozen_model_id_priority
  priority_by: [model_id]
  frozen_before: T_pilot_reveal
  rationale: deterministic and independent of physical performance

rules:
  S_dig:
    description: equal-weight mean of per-family digital AUC over candidates
    reads_physical: false
    implementation_status: implemented
    module: proxy_selection.selectors
  S_real:
    description: same C_b budget, select by physical AUC
    reads_physical: true
    physical_budget: B_groups
    implementation_status: implemented
  S_shrink:
    description: fixed 0.5 blend of z-scored digital and physical scores
    reads_physical: true
    fixed_weight: 0.5
    implementation_status: implemented
  S_quality:
    description: quality/size-matched digital proxy using approved C_b statistics
    reads_physical: true
    implementation_status: planned
  S_weight:
    description: constrained non-negative simplex weights over 3-4 families
    reads_physical: true
    implementation_status: implemented_experimental
  S_residual:
    description: residual/control-variate corrected proxy
    reads_physical: true
    implementation_status: planned

cost_accounting:
  capture_cost_multiplies_by_model_count: false
  inference_cost_tracked_per_model: true
  replays_are_new_physical_capture: false
  quality_match_uses_real_images: true
